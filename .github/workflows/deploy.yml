name: Deploy to AWS

# 머지 전에도 검사가 돌아야 한다. push 에서만 돌면 깨진 것이 main 에
# 들어간 다음에야 알게 되고, 그때는 배포가 함께 실패한다.
on:
  pull_request:
  push:
    branches: [ main ]

# 같은 브랜치에 연달아 밀면 앞의 것은 멈춘다. 다만 main 은 멈추지 않는다 —
# 배포 도중에 끊기면 어느 쪽이 떠 있는지 알 수 없게 된다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run legacy tests
        run: ./gradlew legacyTest --no-daemon

  deploy:
    needs: ci
    # 검사만 하고 끝낸다. PR 브랜치를 서버에 올리면 아직 합의되지 않은 코드가
    # 운영에 뜬다.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 서버에 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.34.55.28
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_NAME,DB_USER,DB_PASSWORD,DB_ROOT_PASSWORD,JWT_SECRET,ENCRYPTION_SECRET_KEY,ENCRYPTION_HASH_KEY,KAKAO_REST_API_KEY,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NCP_ACCESS_KEY,NCP_SECRET_KEY,NCP_BUCKET,NCP_CDN_DOMAIN,GOODS_SURVEY_S3_BUCKET,GOODS_SURVEY_EXPORT_TOKEN,GOODS_SURVEY_CAMPAIGN_ID,GOODS_FLEA_CAMPAIGN_ID,GIT_SHA,ADMIN_JWT_SECRET,ADMIN_BOOTSTRAP_TOKEN,TOSS_CLIENT_KEY,TOSS_SECRET_KEY,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,APP_CORS_ALLOWED_ORIGINS,DEV_LOGIN_PASSWORD,FIREBASE_SERVICE_ACCOUNT_JSON,APPLE_BUNDLE_ID,APPLE_TEAM_ID,APPLE_KEY_ID,APPLE_PRIVATE_KEY,ALIGO_API_KEY,ALIGO_USER_ID,ALIGO_SENDER,GOODS_BANK_NAME,GOODS_BANK_ACCOUNT,GOODS_BANK_HOLDER
          script: |
            cd /home/ubuntu/Pawever-back

            # 최신 코드로 정렬
            git fetch origin main
            git checkout -B main origin/main

            # Firebase 서비스 계정 키 파일 생성
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /home/ubuntu/Pawever-back/firebase-service-account.json

            cat > .env << EOF
            DB_NAME=$DB_NAME
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD
            JWT_SECRET=$JWT_SECRET
            ENCRYPTION_SECRET_KEY=$ENCRYPTION_SECRET_KEY
            ENCRYPTION_HASH_KEY=$ENCRYPTION_HASH_KEY
            KAKAO_REST_API_KEY=$KAKAO_REST_API_KEY
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            NCP_ACCESS_KEY=$NCP_ACCESS_KEY
            NCP_SECRET_KEY=$NCP_SECRET_KEY
            NCP_BUCKET=$NCP_BUCKET
            NCP_CDN_DOMAIN=$NCP_CDN_DOMAIN
            GOODS_SURVEY_S3_BUCKET=$GOODS_SURVEY_S3_BUCKET
            GOODS_SURVEY_EXPORT_TOKEN=$GOODS_SURVEY_EXPORT_TOKEN
            GOODS_SURVEY_CAMPAIGN_ID=$GOODS_SURVEY_CAMPAIGN_ID
            GOODS_FLEA_CAMPAIGN_ID=$GOODS_FLEA_CAMPAIGN_ID
            ADMIN_JWT_SECRET=$ADMIN_JWT_SECRET
            ADMIN_BOOTSTRAP_TOKEN=$ADMIN_BOOTSTRAP_TOKEN
            TOSS_CLIENT_KEY=$TOSS_CLIENT_KEY
            TOSS_SECRET_KEY=$TOSS_SECRET_KEY
            TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
            ALIGO_API_KEY=$ALIGO_API_KEY
            ALIGO_USER_ID=$ALIGO_USER_ID
            ALIGO_SENDER=$ALIGO_SENDER
            GOODS_BANK_NAME=$GOODS_BANK_NAME
            GOODS_BANK_ACCOUNT=$GOODS_BANK_ACCOUNT
            GOODS_BANK_HOLDER=$GOODS_BANK_HOLDER
            APP_CORS_ALLOWED_ORIGINS=$APP_CORS_ALLOWED_ORIGINS
            DEV_LOGIN_PASSWORD=$DEV_LOGIN_PASSWORD
            FIREBASE_CREDENTIALS_PATH=file:/app/firebase-service-account.json
            APPLE_BUNDLE_ID=$APPLE_BUNDLE_ID
            APPLE_TEAM_ID=$APPLE_TEAM_ID
            APPLE_KEY_ID=$APPLE_KEY_ID
            APPLE_PRIVATE_KEY=$APPLE_PRIVATE_KEY
            EOF

            UPSTREAM_CONF=/etc/nginx/conf.d/pawever-upstream.conf

            # 캠페인이 비어 있으면 앱 기본값(1차)으로 되돌아간다. 2026-09-01 에
            # 이 값이 목록에 없어 배포가 .env 를 덮어쓰면서 2차 설정이 날아갔고,
            # 화면이 마감된 1차 모집을 보여줬다. 조용히 틀리느니 여기서 멈춘다.
            if [ -z "$GOODS_SURVEY_CAMPAIGN_ID" ]; then
              echo "🚨 GOODS_SURVEY_CAMPAIGN_ID 가 비어 있다. 저장소 변수에 설정해야 한다."
              exit 1
            fi

            # 대상 포트에서 "우리가 방금 빌드한 커밋"이 답할 때까지 최대 120초 대기.
            #
            # 200 인지만 보면 안 된다. 같은 포트를 잡고 있던 사흘 된 컨테이너가
            # 200 을 돌려주는 바람에 배포가 성공했다고 보고하고 트래픽을 옛 버전으로
            # 넘긴 적이 있다(2026-09-01, 38분 장애). 새 컨테이너는 뜨지도 못했다.
            wait_healthy() {
              for _ in $(seq 1 24); do
                RUNNING_SHA=$(curl -fsS "http://localhost:$1/health" 2>/dev/null | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
                if [ "$RUNNING_SHA" = "$GIT_SHA" ]; then return 0; fi
                sleep 5
              done
              echo "   마지막으로 답한 커밋: ${RUNNING_SHA:-(응답 없음)} / 기대한 커밋: $GIT_SHA"
              return 1
            }

            # 현재 nginx 활성 포트 → 반대편(비활성) 색 결정
            CURRENT_PORT=$(grep -oE '28080|28081' "$UPSTREAM_CONF" 2>/dev/null | head -1)
            if [ "$CURRENT_PORT" = "28081" ]; then
              NEW_COLOR=blue;  NEW_PORT=28080; OLD_COLOR=green
            else
              NEW_COLOR=green; NEW_PORT=28081; OLD_COLOR=blue
            fi
            echo "▶ 배포: ${OLD_COLOR}(${CURRENT_PORT:-none}) → ${NEW_COLOR}(${NEW_PORT})"

            # 비활성 색만 빌드·기동 (DB·현재 서빙 색은 그대로 유지)
            #
            # 실패를 삼키면 안 된다. 포트가 겹쳐 컨테이너가 뜨지 못해도 로그가
            # 파일로 빠져 아무도 보지 못했고, 배포는 그대로 다음 단계로 갔다.
            if ! docker compose --profile bluegreen up -d --build "app-${NEW_COLOR}" > /tmp/deploy.log 2>&1; then
              echo "❌ ${NEW_COLOR} 기동 실패 → 전환 안 함(기존 ${OLD_COLOR} 계속 서빙)"
              tail -50 /tmp/deploy.log
              exit 1
            fi

            if wait_healthy "$NEW_PORT"; then
              # nginx upstream 을 새 포트로 전환 + graceful reload → 끊김 0
              echo "upstream pawever_backend { server 127.0.0.1:${NEW_PORT}; }" | sudo tee "$UPSTREAM_CONF" > /dev/null
              if sudo nginx -t && sudo nginx -s reload; then
                echo "✅ 무중단 전환 성공 → ${NEW_COLOR}:${NEW_PORT}"
                docker compose stop "app-${OLD_COLOR}" > /dev/null 2>&1 || true
              else
                echo "🚨 nginx 리로드 실패 → 전환 취소(기존 ${OLD_COLOR} 유지)"
                docker compose stop "app-${NEW_COLOR}" > /dev/null 2>&1 || true
                exit 1
              fi
            else
              echo "❌ ${NEW_COLOR}:${NEW_PORT} 가 이 커밋을 돌려주지 않는다 → 전환 안 함(기존 ${OLD_COLOR} 계속 서빙)"
              tail -50 /tmp/deploy.log
              docker compose stop "app-${NEW_COLOR}" > /dev/null 2>&1 || true
              exit 1
            fi
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_SECRET_KEY: ${{ secrets.ENCRYPTION_SECRET_KEY }}
          ENCRYPTION_HASH_KEY: ${{ secrets.ENCRYPTION_HASH_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
          NCP_BUCKET: ${{ secrets.NCP_BUCKET }}
          NCP_CDN_DOMAIN: ${{ secrets.NCP_CDN_DOMAIN }}
          GOODS_SURVEY_S3_BUCKET: ${{ secrets.GOODS_SURVEY_S3_BUCKET }}
          GOODS_SURVEY_EXPORT_TOKEN: ${{ secrets.GOODS_SURVEY_EXPORT_TOKEN }}
          # 비밀이 아니라 설정이다. 어느 회차를 파는지는 숨길 값이 아니고,
          # 회차가 바뀔 때 코드를 고치지 않고 바꿀 수 있어야 한다.
          GOODS_SURVEY_CAMPAIGN_ID: ${{ vars.GOODS_SURVEY_CAMPAIGN_ID }}
          # 플리마켓 모집. 비어 있으면 그 경로 자체가 열리지 않으므로, 여기서는
          # 값이 없다고 배포를 멈추지 않는다. 행사가 끝나면 이 변수를 지워 닫는다.
          GOODS_FLEA_CAMPAIGN_ID: ${{ vars.GOODS_FLEA_CAMPAIGN_ID }}
          # 이 배포가 올리는 커밋. 이미지에 새기고, 뜬 뒤에 같은 값이 돌아오는지 본다.
          GIT_SHA: ${{ github.sha }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_BOOTSTRAP_TOKEN: ${{ secrets.ADMIN_BOOTSTRAP_TOKEN }}
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          # 굿즈 신청 접수 알림. 없으면 알림만 안 나가고 접수는 그대로 된다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 입금 안내 문자. 여섯 개가 다 있어야 나간다 — 하나라도 비면
          # 신청자는 계좌를 못 받고 주문이 시간이 지나 만료된다.
          ALIGO_API_KEY: ${{ secrets.ALIGO_API_KEY }}
          ALIGO_USER_ID: ${{ secrets.ALIGO_USER_ID }}
          ALIGO_SENDER: ${{ secrets.ALIGO_SENDER }}
          GOODS_BANK_NAME: ${{ secrets.GOODS_BANK_NAME }}
          GOODS_BANK_ACCOUNT: ${{ secrets.GOODS_BANK_ACCOUNT }}
          GOODS_BANK_HOLDER: ${{ secrets.GOODS_BANK_HOLDER }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS || 'https://www.pawever.kr,https://pawever.kr,https://pawever-landing.pages.dev,https://feat-goods-survey-landing.pawever-landing.pages.dev' }}
          DEV_LOGIN_PASSWORD: ${{ secrets.DEV_LOGIN_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
