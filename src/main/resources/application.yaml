spring:
  application:
    name: pawever-backend

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost:23306}/${DB_NAME:pawever}
    username: ${DB_USER:pawever}
    password: ${DB_PASSWORD:pawever1234}
    driver-class-name: org.mariadb.jdbc.Driver

  # 스키마는 Flyway가 관리한다. 이미 스키마가 있는 DB(운영)는 V1을 실행하지 않고 기준선으로만 마킹.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100  # 지연 로딩 N+1 완화 (IN 절 배치 조회)
    # Flyway가 Hibernate보다 먼저 스키마를 준비해야 하므로 JPA 뒤로 초기화를 미루지 않는다.
    defer-datasource-initialization: false

  sql:
    init:
      mode: always
      # Local run (non-docker): seed data only.
      # Schema is managed by Hibernate (ddl-auto).
      data-locations: classpath:breeds_data.sql,classpath:missions_data.sql,classpath:funeral_companies_data.sql,classpath:data.sql,classpath:faq_data.sql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # 이 이미지를 만든 커밋. Dockerfile 의 ARG GIT_SHA 로 들어온다.
  # 배포가 /health 에서 이 값을 읽어 자기가 방금 빌드한 것과 맞는지 본다.
  git-sha: ${APP_GIT_SHA:}

jwt:
  secret: ${JWT_SECRET:pawever-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000  # 24 hours

dev:
  login:
    password: ${DEV_LOGIN_PASSWORD:}

encryption:
  secret-key: ${ENCRYPTION_SECRET_KEY:cGF3ZXZlci1hZXMtMjU2LWtleS0zMmJ5dGVzLWxvbmc=}
  hash-key: ${ENCRYPTION_HASH_KEY:aGFzaC1rZXktZm9yLWJsaW5kLWluZGV4LTMyYnl0ZXM=}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

naver:
  client-id: ${NAVER_CLIENT_ID:}
  client-secret: ${NAVER_CLIENT_SECRET:}

apple:
  bundle-id: ${APPLE_BUNDLE_ID:}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}

cloud:
  ncp:
    credentials:
      access-key: ${NCP_ACCESS_KEY:}
      secret-key: ${NCP_SECRET_KEY:}
    region: ${NCP_REGION:ap-northeast-2}
    s3:
      endpoint: ${NCP_S3_ENDPOINT:}
      bucket: ${NCP_BUCKET:}
    cdn:
      domain: ${NCP_CDN_DOMAIN:}

survey:
  goods:
    campaign-id: ${GOODS_SURVEY_CAMPAIGN_ID:goods-2026-07}
    questionnaire-version: 2026-07-25-v2
    legacy-questionnaire-versions:
      - 2026-07-23-v1
    privacy-consent-version: 2026-07-23
    # 제작 사진은 기존 공개 이미지 버킷과 분리한 AWS S3 비공개 버킷에 저장한다.
    photo-bucket: ${GOODS_SURVEY_S3_BUCKET:}
    reservation-minutes: 15
    upload-url-minutes: 10
    personal-data-retention-days: 90
    # 설문 응답·사연은 "수집 후 2년"으로 고지한다.
    survey-retention-days: 730
    # 유료 판매의 계약·결제·공급 기록. 전자상거래법이 5년을 요구한다.
    contract-retention-days: 1825
    # 굿즈 정상가. 2차 주력은 3D 전신 피규어 한 종이라 값이 하나다.
    list-price-krw: ${GOODS_LIST_PRICE_KRW:29900}
    # 설문에 답하고 온 사람에게 깎아 주는 금액.
    survey-discount-krw: ${GOODS_SURVEY_DISCOUNT_KRW:6000}
    # 화면에는 따로 보여 주고 결제는 한 번에 받는다.
    shipping-fee-krw: ${GOODS_SHIPPING_FEE_KRW:3000}
    # 주문을 만든 뒤 결제를 기다리는 시간.
    payment-window-minutes: 30
    # 보유 기간이 지난 개인정보를 지우는 작업. 한국 시각 기준 새벽 4시 15분.
    purge-cron: ${GOODS_SURVEY_PURGE_CRON:0 15 4 * * *}
    # 결제 대기는 30분짜리다. 새벽 파기만 믿으면 하루를 기다린다.
    payment-expiry-cron: ${GOODS_SURVEY_PAYMENT_EXPIRY_CRON:0 */5 * * * *}
    # 결과 CSV를 내려받는 토큰. 비어 있으면 내보내기가 열리지 않는다.
    export-token: ${GOODS_SURVEY_EXPORT_TOKEN:}

admin:
  # 키 이름은 AdminProperties 의 필드 이름과 맞아야 한다. jwt.secret 처럼 한 단계
  # 더 들어가면 중첩 클래스를 찾으므로 jwtSecret 에는 붙지 않는다.
  #
  # 앱 회원 토큰과 서명 키를 나눈다. 같은 키를 쓰면 앱 토큰 하나로 관리자
  # 요청을 통과시킬 수 있는지가 claim 검사 하나에만 달린다.
  # 기본값을 두지 않는다. 비어 있으면 관리자 로그인이 열리지 않는다.
  jwt-secret: ${ADMIN_JWT_SECRET:}
  # 고객 주소와 연락처를 다루는 화면이라 짧게 둔다.
  jwt-expiration-millis: 28800000  # 8 hours
  # 첫 관리자를 세울 때만 쓴다. 관리자가 하나라도 생기면 통로가 스스로 닫힌다.
  bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}

stats:
  # 앱 통계 CSV를 내려받는 토큰. 비어 있으면 내보내기가 열리지 않는다.
  # 설문 토큰과 나눠 둔다. 통계는 집계값뿐이라 팀 안에서 넓게 공유되는데,
  # 같은 토큰을 쓰면 이름·연락처·주소가 나가는 설문 통로까지 함께 열린다.
  export-token: ${STATS_EXPORT_TOKEN:}

payment:
  toss:
    # 화면이 결제창을 여는 데 쓴다. 밖에 나가도 되는 값이다.
    client-key: ${TOSS_CLIENT_KEY:}
    # 승인·조회·취소에 쓴다. 서버 밖으로 나가면 안 된다.
    # 비어 있으면 결제 통로가 열리지 않는다. 기본값을 두면 그 값이 운영에 나간다.
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

notification:
  telegram:
    # 봇 토큰은 그 자체가 봇이다. 이 값을 가진 사람은 우리 채널에 글을 쓰고
    # 봇이 받는 메시지를 읽는다. 카톡으로 오간 적이 있어 폐기하고 다시 받았다.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # 비공개 채널이라 @이름이 없다. -100 으로 시작하는 숫자이고,
    # 봇이 그 채널의 관리자로 들어가 있어야 글이 써진다.
    chat-id: ${TELEGRAM_CHAT_ID:}
    base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
